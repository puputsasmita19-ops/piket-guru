name: Piket Guru - R60 gate after R61 (no deploy)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/piket-guru-r60-release-gate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      # NO Firebase/Drive/Vercel secrets passed to this job.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build + R61 regression + isolated synthetic test
        run: node scripts/r60_release_gate.cjs --run --install
