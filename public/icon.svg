    <rect x="245" y="176" width="72" height="14" rx="7" fill="#6b7b8f"/>
    <rect x="245" y="214" width="92" height="14" rx="7" fill="#6b7b8f" opacity=".96"/>
    <rect x="245" y="252" width="80" height="14" rx="7" fill="#6b7b8f" opacity=".88"/>
