  <head>
    <meta charset="UTF-8" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('piket_guru_theme') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }

          var savedPastel = localStorage.getItem('piket_guru_pastel_theme') || 'default';
          document.documentElement.setAttribute('data-pastel-theme', savedPastel);

          var darkColors = { default: '#0f172a', sky: '#0c1a26', mint: '#0a1f17', lavender: '#181028', peach: '#1f140b', rose: '#200d13' };
          var lightColors = { default: '#2563eb', sky: '#0284c7', mint: '#059669', lavender: '#7c3aed', peach: '#ea580c', rose: '#e11d48' };
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', isDark ? (darkColors[savedPastel] || '#0f172a') : (lightColors[savedPastel] || '#2563eb'));
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
